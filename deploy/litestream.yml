# =============================================================================
# GaOTTT Multiverse — Litestream replica template (MV5)
# =============================================================================
#
# This file is a TEMPLATE / commented example. The authoritative ``dbs:``
# block is REGENERATED by ``scripts/gen_litestream_config.py`` (typically
# invoked from the supervisor's backup hook — see Operations-Backup-
# Multiverse.md §supervisor hook). Do NOT hand-edit the generated ``dbs:``
# entries; edit this template only to change replica *storage topology*
# (e.g. switch ``file`` to ``s3``).
#
# ----------------------------------------------------------------------------
# Backup scope (read before operating)
# ----------------------------------------------------------------------------
#
# Litestream replicates **SQLite WAL only**. Each universe's
# ``manifest.json`` is NOT a litestream target, but it is a MANDATORY part
# of the backup set: a restore without the matching manifest cannot pass
# ``verify_embedder_identity`` (the embedder-identity startup gate), so
# "SQLite-only restore" is false. The backup set is the **2-point set**
# { gaottt.db, manifest.json } per universe.
#
# Manifest backup options (pick one, document your choice in the runbook):
#
#   (A) Filesystem snapshot of the whole ``<multiverse_root>`` (ZFS / Btrfs /
#       LVM snapshot) — most robust, captures manifest + db atomically-ish.
#
#   (B) An ``exec`` command mirroring manifests to a separate location. The
#       ``exec`` example below copies every universe's manifest into a
#       parallel directory tree that you then snapshot/rsync independently.
#
#   (C) A cron rsync of ``universes/*/manifest.json`` to object storage.
#
# FAISS files (gaottt.faiss / gaottt.virtual.faiss) are deliberately NOT
# replicated by default — they are deterministically rebuildable from
# SQLite + the embedder artifact via ``scripts/rebuild_faiss_from_db.py``
# (the 2026-05-31 reverse-overwrite recovery proved this). Replicating them
# is an optional RTO optimization for large universes (see the "optional
# FAISS snapshot" section of the Operations doc).
#
# ----------------------------------------------------------------------------
# ⚠ Credential isolation (read before deploying)
# ----------------------------------------------------------------------------
#
# The supervisor's ``_build_spawn_env`` strips only ``GAOTTT_*`` env vars;
# every other variable in the supervisor's environment (including
# ``AWS_SECRET_ACCESS_KEY``, ``LITESTREAM_*``, S3/GCS keys, …) is INHERITED
# by each spawned backend subprocess. If the supervisor's systemd unit (or
# the shell that launched it) carries object-store credentials, every
# per-universe backend process will receive them too.
#
# RULE: supply litestream / object-store credentials via a DEDICATED unit
# for the litestream daemon — NOT via the supervisor's environment. Run
# litestream as its own service that reads from ``/etc/litestream/env``:
#
#   # /etc/systemd/system/litestream.service
#   [Unit]
#   Description=Litestream (GaOTTT multiverse replica)
#   After=network-online.target
#
#   [Service]
#   EnvironmentFile=/etc/litestream/env     # AWS_SECRET_ACCESS_KEY=... etc.
#   ExecStart=/usr/local/bin/litestream replicate -config /etc/litestream/gaottt.yml
#   Restart=on-failure
#
#   [Install]
#   WantedBy=multi-user.target
#
# Keep the supervisor's own unit free of any LITESTREAM_* / object-store
# secret. This keeps the per-universe backends from inheriting write access
# to the object store. (Structural allowlist hardening of _build_spawn_env
# is tracked as a separate stage; v1 mitigates via this deployment rule.)
#
# =============================================================================

# ---- Option (B): manifest mirror via litestream exec ----------------------
# Uncomment and adapt to mirror every universe manifest to a parallel tree.
# This runs after each successful WAL replicate on the host running litestream.
#
# dbs:
#   - path: /var/lib/gaottt-multiverse/universes/<uid>/gaottt.db
#     replicas:
#       - type: file
#         path: /var/lib/litestream/gaottt-multiverse/<uid>
#         retention: 24h
#         retention-check-interval: 1h
#         snapshot-interval: 1h
#         # exec runs a shell command after each successful sync. We mirror
#         # the sibling manifest.json into a parallel tree so a restore has
#         # both files available. Adjust the source root to your multiverse_root.
#         exec:
#           command: |
#             mkdir -p /var/lib/litestream/gaottt-multiverse-manifests/<uid> && \
#             cp -a /var/lib/gaottt-multiverse/universes/<uid>/manifest.json \
#                   /var/lib/litestream/gaottt-multiverse-manifests/<uid>/

# ---- Option (A): S3 replica example (uncomment + fill bucket) --------------
# dbs:
#   - path: /var/lib/gaottt-multiverse/universes/<uid>/gaottt.db
#     replicas:
#       - type: s3
#         bucket: my-gaottt-backups
#         path: multiverse/<uid>
#         # AWS credentials via the standard env vars litestream reads.

